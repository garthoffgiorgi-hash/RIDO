name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  context-check:
    name: Context drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.6.0"
      - run: npm run check:context
      # The marketing site's rates are generated from supabase/seed/commission_tiers.sql. This
      # fails the build if the seed changed and the generated file wasn't regenerated — i.e. if
      # the database and the website would disagree about what RIDO charges. No install needed.
      - run: npm run check:tiers

  lint:
    name: Lint + format (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.6.0"
      # Biome is the repo's only lint/format toolchain, so a bare `npm ci` at the root is all it
      # needs — no workspace installs, no build step.
      - run: npm ci
      - run: npm run lint

  pricing-node:
    name: packages/pricing tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.6.0"
      # packages/pricing is dependency-free by design (packages/pricing/CLAUDE.md) — no install
      # step needed. Node runs the .ts files directly via --experimental-strip-types.
      - run: npm test --workspace=packages/pricing

  pricing-deno:
    name: packages/pricing tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Two distinct guarantees, and neither needs an install — which is itself an assertion that
      # the package is genuinely dependency-free:
      #
      #   check — type-checks the SHIPPED SOURCE under Deno's own resolution rules. This is what
      #           proves the module Edge Functions import stays Deno-compatible.
      #   test  — proves Deno and Node compute the same numbers (ADR-0005), the one failure mode
      #           that would silently break the books.
      #
      # `test` passes --no-check deliberately. The test files import node:test / node:assert,
      # and type-checking those requires @types/node from node_modules, which this job has no
      # reason to install. The source is still fully type-checked by the step above, and the
      # tests are type-checked locally, where node_modules exists. Removing --no-check without
      # adding an install step will fail here while passing on your machine.
      - run: npm run check:pricing:deno
      - run: npm run test:pricing:deno

  unit-node:
    name: Unit tests needing node_modules (Edge Function, web lib, pilot model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.6.0"
      # Unlike pricing-node, these need `npm ci`: both suites import "@rido/pricing" by package
      # name, which Node resolves through the workspace symlink in node_modules. (Deno resolves
      # the same specifier through supabase/functions/deno.json, which is why the Deno job
      # doesn't install anything.) One install, both suites.
      - run: npm ci
      - run: npm run test:functions
      # The fare card was CALIBRATED to sit a target margin under a modelled incumbent fare. This
      # reads supabase/seed/fare_rate_cards.sql and fails if that margin has drifted out of band,
      # or if a driver would earn less than on an incumbent for any trip shape. Needs node_modules
      # because it calls @rido/pricing rather than reimplementing the arithmetic.
      - run: npm run check:calibration
      # apps/web's pure lib logic — ADR-0007's "pure logic in src/lib/ ships with tests".
      - run: npm test --workspace=apps/web
      # The pilot model is money math too, now that it calls @rido/pricing instead of carrying
      # its own copy. ADR-0005 wanted this; ADR-0007 says it comes with tests.
      - run: npm test --workspace=tools/pilot-model

  functions-deno:
    name: Edge Function (Deno — the runtime it actually runs on)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # check — type-checks the deployed entry point under Deno's own resolution, including the
      #         real @supabase/supabase-js. This is what catches an Edge Function that would
      #         fail on deploy rather than in review.
      # test  — runs the pure core (core.test.ts) on the runtime that will execute it, so the
      #         authorization rule and the pricing call are proven where they'll run, not only
      #         under Node.
      #
      # --no-check on `test` for the same reason as pricing-deno: the test files import
      # node:test / node:assert, and type-checking those needs @types/node from node_modules,
      # which this job has no reason to install. The shipped source is fully type-checked by the
      # step above. Removing --no-check without adding an install step fails here and passes
      # locally.
      #
      # BOTH scripts pass `--config supabase/functions/deno.json` explicitly, and must keep doing
      # so. Deno discovers a config file by walking up from the CURRENT WORKING DIRECTORY, not
      # from the entry file — so run from the repo root, it never finds the functions' import map
      # on its own. Dropping the flag passes on a developer machine anyway, because root
      # node_modules/ holds both @rido/pricing (a workspace symlink) and @supabase/supabase-js
      # (apps/web's dependency), and Deno falls back to node_modules resolution. It then fails
      # here, where there is no install step. That is not a hypothetical: it is exactly how this
      # job first broke.
      - run: npm run check:functions:deno
      - run: npm run test:functions:deno
