name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  context-check:
    name: Context drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.6.0"
      - run: npm run check:context

  lint:
    name: Lint + format (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.6.0"
      # Biome is the repo's only lint/format toolchain, so a bare `npm ci` at the root is all it
      # needs — no workspace installs, no build step.
      - run: npm ci
      - run: npm run lint

  pricing-node:
    name: packages/pricing tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.6.0"
      # packages/pricing is dependency-free by design (packages/pricing/CLAUDE.md) — no install
      # step needed. Node runs the .ts files directly via --experimental-strip-types.
      - run: npm test --workspace=packages/pricing

  pricing-deno:
    name: packages/pricing tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Two distinct guarantees, and neither needs an install — which is itself an assertion that
      # the package is genuinely dependency-free:
      #
      #   check — type-checks the SHIPPED SOURCE under Deno's own resolution rules. This is what
      #           proves the module Edge Functions import stays Deno-compatible.
      #   test  — proves Deno and Node compute the same numbers (ADR-0005), the one failure mode
      #           that would silently break the books.
      #
      # `test` passes --no-check deliberately. The test files import node:test / node:assert,
      # and type-checking those requires @types/node from node_modules, which this job has no
      # reason to install. The source is still fully type-checked by the step above, and the
      # tests are type-checked locally, where node_modules exists. Removing --no-check without
      # adding an install step will fail here while passing on your machine.
      - run: npm run check:pricing:deno
      - run: npm run test:pricing:deno
